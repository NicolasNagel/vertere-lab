<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>1 · LOGIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


<style>
  body { font-family: 'Manrope', -apple-system, sans-serif; color: #1A2D45; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Big Shoulders Display', 'Manrope', sans-serif; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 800; }
  .serif em { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; text-transform: none; letter-spacing: 0; font-weight: 500; color: #9CBFC2; }
  .script { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .frame-card { background: #FFFFFF; border-radius: 4px; box-shadow: 0 1px 3px rgba(28,45,69,0.08), 0 8px 32px rgba(28,45,69,0.06); overflow: hidden; }
  .frame-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B7B8C; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .frame-label::before { content:''; width: 22px; height: 1px; background: #6B7B8C; }
  .tab-active { color: #2C4768; border-bottom: 2px solid #2C4768; }
  .tab-inactive { color: #6B7B8C; border-bottom: 2px solid transparent; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<style>
  body { margin:0; padding:32px; background:#EEEAE0; }
  /* Reset .frame-label hide */
</style>
</head>
<body>
<div style="width:1280px; margin:0 auto;">
  <div class="frame-card" style="height:780px; display:flex;">
    <!-- Left brand panel -->
    <div style="width:560px; background:#2C4768; color:#fff; padding:64px 56px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;">
      <div style="position:absolute; right:-180px; top:-160px; width:520px; height:520px; border-radius:50%; background:rgba(156,191,194,0.08);"></div>
      <div style="position:absolute; right:-40px; bottom:-200px; width:380px; height:380px; border-radius:50%; background:rgba(156,191,194,0.06);"></div>
      <div style="position:relative; z-index:1;">
        <div style="text-align:center;">
          <img src="assets/vertere-logo-white.png" alt="Vertere — Laboratório Veterinário" style="width:340px; height:auto; display:block; margin:0 auto;"/>
        </div>
        <div class="serif" style="font-size:46px; line-height:1.08; margin-top:80px; max-width:440px;">Cada amostra,<br/><em>uma história.</em><br/>Cada resultado,<br/><em>um cuidado.</em></div>
      </div>
      <div style="position:relative; z-index:1; font-size:11px; opacity:0.5; letter-spacing:0.1em;">v 2.4.1 · JARAGUÁ DO SUL — SC</div>
    </div>
    <!-- Right form -->
    <div style="flex:1; padding:80px 72px; display:flex; flex-direction:column; justify-content:center; background:#FBFAF6;">
      <div style="max-width:380px;">
        <div class="mono" style="font-size:11px; letter-spacing:0.18em; color:#6B7B8C; text-transform:uppercase;">Acesso ao sistema</div>
        <h1 class="serif" style="font-size:48px; margin:8px 0 40px; color:#1F3450; line-height:1;">Bem-vinda<br/><em>de volta.</em></h1>

        <label style="display:block; font-size:12px; letter-spacing:0.08em; color:#2C4768; margin-bottom:8px; text-transform:uppercase; font-weight:600;">Usuário</label>
        <div style="background:#fff; border:1px solid #E5E2DB; border-radius:2px; padding:14px 16px; margin-bottom:22px; display:flex; align-items:center; gap:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7B8C" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          <span style="color:#1A2D45; font-size:14px;">fabianna.garcia</span>
        </div>

        <label style="display:block; font-size:12px; letter-spacing:0.08em; color:#2C4768; margin-bottom:8px; text-transform:uppercase; font-weight:600;">Senha</label>
        <div style="background:#fff; border:1px solid #E5E2DB; border-radius:2px; padding:14px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7B8C" stroke-width="1.6"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span class="mono" style="color:#1A2D45; font-size:14px; letter-spacing:0.3em;">••••••••••</span>
          <span style="margin-left:auto; color:#6B7B8C; font-size:12px;">mostrar</span>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:36px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#6B7B8C;">
            <span style="width:14px; height:14px; border:1px solid #2C4768; background:#2C4768; border-radius:2px; display:flex; align-items:center; justify-content:center;">
              <svg width="8" height="8" viewBox="0 0 10 10"><path d="M1 5l3 3 5-6" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
            </span>
            Manter conectada
          </label>
          <a style="font-size:13px; color:#2C4768; text-decoration:underline; text-underline-offset:3px;">Esqueci a senha</a>
        </div>

        <button style="width:100%; background:#2C4768; color:#fff; border:none; padding:16px; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600; border-radius:2px; cursor:pointer; font-family:inherit;">Entrar no sistema</button>

        <div style="margin-top:32px; padding-top:24px; border-top:1px solid #E5E2DB; font-size:12px; color:#6B7B8C; text-align:center;">
          Problemas para acessar? Fale com o administrador.
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
