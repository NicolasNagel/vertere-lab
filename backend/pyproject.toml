[project]
name = "vertere-backend"
version = "0.1.0"
description = "Vertere Lab backend — FastAPI + SQLAlchemy + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Vercel Python runtime — reads dependencies straight from this file (no
# requirements.txt needed) and loads `app` from `app/asgi.py` as the ASGI
# handler (docs/04-arquitetura.md §15).
[tool.vercel]
entrypoint = "app.asgi:app"
