name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vertere
          POSTGRES_PASSWORD: vertere
          POSTGRES_DB: vertere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vertere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vertere:vertere@localhost:5432/vertere_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar Python 3.12
        run: uv python install 3.12

      - name: Instalar dependencias
        run: uv sync --frozen --group dev

      - name: Lint e formatacao
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tipagem
        run: uv run mypy .

      - name: Migracoes em banco limpo
        run: uv run alembic upgrade head

      - name: Testes com PostgreSQL real
        run: uv run pytest -q --maxfail=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Tipagem
        run: npm run typecheck

      - name: Testes
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e-critico:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright e axe
        run: npm run test:e2e

  gate:
    needs: [backend, frontend, e2e-critico]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checar resultado dos jobs
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.e2e-critico.result }}" != "success" ]]; then
            echo "Gate vermelho — backend: ${{ needs.backend.result }}, frontend: ${{ needs.frontend.result }}, e2e: ${{ needs.e2e-critico.result }}"
            exit 1
          fi
          echo "Gate verde."
